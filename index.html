<!DOCTYPE html>
<html>
<head>
  <title>FREC Toilet Run</title>
</head>
<body style="text-align:center;">

<h2>FREC RUN!</h2>
<canvas id="game" width="800" height="200" style="border:3px solid purple; background-color:#f0e6ff;"></canvas>
<p>Press SPACE to jump / restart</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gravity = 0.8;
let gameOver = false;
let score = 0;

/* ---------- PHYSICS EQUATIONS FOR OBSTACLES ---------- */
const equations = [
  "F = ma",
  "v = v₀ + at",
  "W = Fd",
  "p = mv",
  "ΔE = mcΔT",
  "τ = rF",
  "k = 1/2 mv²",
  "λ = v/f"
];

/* ---------- PLAYER: FREC ON A TOILET ---------- */
const frec = {
  x: 50,
  y: 140,
  w: 40,
  h: 50,
  vy: 0,
  jumping: false,

  draw() {
    /* --- Toilet base --- */
    ctx.fillStyle = "white";
    ctx.fillRect(this.x + 5, this.y + 40, 30, 20);

    /* Toilet bowl */
    ctx.beginPath();
    ctx.arc(this.x + 20, this.y + 40, 12, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    /* Toilet seat outline */
    ctx.strokeStyle = "#9ca3af";
    ctx.beginPath();
    ctx.arc(this.x + 20, this.y + 40, 10, 0, Math.PI * 2);
    ctx.stroke();

    /* Toilet tank */
    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(this.x + 5, this.y + 20, 30, 15);

    /* Flush handle */
    ctx.fillStyle = "#6b7280";
    ctx.fillRect(this.x + 30, this.y + 25, 5, 5);

    /* --- FREC standing on toilet --- */

    // Jacket
    ctx.fillStyle = "#5b21b6";
    ctx.fillRect(this.x, this.y - 10, this.w, this.h);

    // Head
    ctx.fillStyle = "#a855f7";
    ctx.beginPath();
    ctx.arc(this.x + 20, this.y - 20, 12, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.strokeStyle = "#7c3aed";
    ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(this.x + 20, this.y - 32);
      ctx.lineTo(this.x + 5 + i * 7, this.y - 45 - Math.random() * 5);
      ctx.stroke();
    }

    // Skirt
    ctx.fillStyle = "#b91c1c";
    ctx.fillRect(this.x, this.y + 25, this.w, 15);

    // Boots
    ctx.fillStyle = "black";
    ctx.fillRect(this.x + 5, this.y + 40, 10, 10);
    ctx.fillRect(this.x + 25, this.y + 40, 10, 10);
  },

  update() {
    this.vy += gravity;
    this.y += this.vy;

    if (this.y >= 140) {
      this.y = 140;
      this.vy = 0;
      this.jumping = false;
    }
  },

  jump() {
    if (!this.jumping) {
      this.vy = -12;
      this.jumping = true;
    }
  }
};

/* ---------- OBSTACLES ---------- */
let obstacles = [];

function spawnObstacle() {
  const eq = equations[Math.floor(Math.random() * equations.length)];
  obstacles.push({
    x: 800,
    y: 150,
    w: 50,
    h: 40,
    eq: eq
  });
}

setInterval(spawnObstacle, 1500);

/* ---------- RESET ---------- */
function resetGame() {
  obstacles = [];
  score = 0;
  gameOver = false;
  frec.y = 140;
  frec.vy = 0;
}

/* ---------- GAME LOOP ---------- */
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ground
  ctx.beginPath();
  ctx.moveTo(0, 190);
  ctx.lineTo(800, 190);
  ctx.stroke();

  if (!gameOver) {
    frec.update();
  }

  frec.draw();

  /* --- Obstacles --- */
  obstacles.forEach(o => {
    if (!gameOver) o.x -= 5;

    ctx.fillStyle = "#d1c4e9";
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = "#5e35b1";
    ctx.strokeRect(o.x, o.y, o.w, o.h);

    ctx.fillStyle = "black";
    ctx.font = "14px Arial";
    ctx.fillText(o.eq, o.x + 5, o.y + 25);

    if (
      frec.x < o.x + o.w &&
      frec.x + frec.w > o.x &&
      frec.y < o.y + o.h &&
      frec.y + frec.h > o.y
    ) {
      gameOver = true;
    }
  });

  obstacles = obstacles.filter(o => o.x + o.w > 0);

  if (!gameOver) score++;

  ctx.fillStyle = "black";
  ctx.fillText("Score: " + score, 650, 20);

  if (gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "20px Arial";
    ctx.fillText("GAME OVER", 330, 90);
    ctx.fillText("Press SPACE to restart", 290, 120);
  }

  requestAnimationFrame(loop);
}

/* ---------- CONTROLS ---------- */
document.addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();
    if (gameOver) resetGame();
    else frec.jump();
  }
});

loop();
</script>

</body>
</html>
